name: AQA Tests + Allure Report (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      # 1️⃣ ТОЛЬКО ТЕСТЫ (генерят allure-results)
      - name: Run tests
        run: mvn clean test -B

      # 2️⃣ УСТАНОВКА ALLURE CLI
      - name: Install Allure
        run: |
          curl -Ls https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz | tar -xz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # 3️⃣ ГЕНЕРАЦИЯ HTML
      - name: Generate Allure Report
        run: |
          allure generate target/allure-results -o public --clean

      # 4️⃣ UPLOAD TO PAGES
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4