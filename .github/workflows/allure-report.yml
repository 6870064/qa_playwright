name: AQA Tests + Allure Report (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      # 1️⃣ RUN TESTS
      # Standard Maven test run. Generates raw data in target/allure-results
      - name: Run tests
        run: mvn clean test -B

      # 2️⃣ INSTALL ALLURE CLI
      # Using 'if: always()' to ensure the report is built even if tests fail
      - name: Install Allure CLI
        if: always()
        run: |
          curl -Ls https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz | tar -xz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # 3️⃣ GENERATE HTML REPORT
      # Converts raw results into a static HTML website in the 'public' folder
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate target/allure-results -o public --clean

      # 4️⃣ UPLOAD AS BUILD ARTIFACT
      # This makes the report available as a downloadable ZIP in the run Summary
      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-zip
          path: public
          retention-days: 10

      # 5️⃣ UPLOAD TO GITHUB PAGES
      # Preparing the 'public' folder for deployment to GitHub Pages
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 6️⃣ DEPLOY TO GITHUB PAGES
      # Publishing the report to https://6870064.github.io/qa_playwright/
      - name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4